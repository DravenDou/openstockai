version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema: db/migrations
    gen:
      go:
        package: database
        out: internal/platform/database
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: products.minimum
            go_type: {import: "github.com/DravenDou/openstockai/apps/api/internal/platform/quantity", type: Amount}
          - column: inventory.quantity
            go_type: {import: "github.com/DravenDou/openstockai/apps/api/internal/platform/quantity", type: Amount}
          - column: stock_movements.quantity
            go_type: {import: "github.com/DravenDou/openstockai/apps/api/internal/platform/quantity", type: Amount}
          - column: purchase_order_items.quantity
            go_type: {import: "github.com/DravenDou/openstockai/apps/api/internal/platform/quantity", type: Amount}
          - db_type: jsonb
            go_type: {import: encoding/json, type: RawMessage}
          - db_type: jsonb
            nullable: true
            go_type: {import: encoding/json, type: RawMessage}
