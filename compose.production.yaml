# Local compiled runtime. Never publishes an Internet-facing port.
# docker compose -f compose.yaml -f compose.production.yaml up -d --build
services:
  postgres:
    restart: unless-stopped
  api:
    restart: unless-stopped
    stop_grace_period: 35s
  web:
    build: {context: ., target: web-production}
    image: ${COMPOSE_PROJECT_NAME:-openstockai}-web:local
    restart: unless-stopped
    command: ["node", "apps/web/server.js"]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3017
    stop_grace_period: 35s
  agent:
    build: {context: ., target: agent-production}
    image: ${COMPOSE_PROJECT_NAME:-openstockai}-agent:local
    restart: unless-stopped
    command: ["node", ".output/server/index.mjs"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4273
      EVE_TRACES_CONTENT: off
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4273/eve/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
